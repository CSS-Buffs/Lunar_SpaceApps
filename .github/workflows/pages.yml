# Builds the static lunar site planner (python/build_site.py) and publishes it with GitHub Pages.
# One-time setup: repository Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
name: Deploy website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/requirements.txt
      - name: Install dependencies
        run: pip install numpy scipy plotly pillow
      - name: Cache NASA downloads (LOLA, Moon Trek tiles, Horizons)
        uses: actions/cache@v4
        with:
          path: data
          key: nasa-data-v1-${{ hashFiles('python/moon_app.py', 'python/build_site.py') }}
          restore-keys: nasa-data-v1-
      - name: Build site
        working-directory: python
        run: python build_site.py --first 2024-01 --last 2028-12
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
