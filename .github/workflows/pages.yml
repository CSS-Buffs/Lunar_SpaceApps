# Publishes the static lunar site planner (index.html, app.js, app.css and the pre-built data in
# data/site/) with GitHub Pages. The data is committed, so nothing is downloaded or rebuilt here:
# after changing it, run `python python/build_site.py` locally and commit data/site/.
# One-time setup: repository Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
# A custom domain is set in the same Settings -> Pages screen; all paths in the site are relative,
# so it works at a domain root or under a sub-path.
name: Deploy website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect the website (index.html, app.js, app.css, data/site)
        run: |
          test -f data/site/config.js || { echo "data/site/ is missing: run python python/build_site.py and commit it"; exit 1; }
          mkdir -p _site/data
          cp index.html app.js app.css _site/
          cp -r data/site _site/data/site
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
